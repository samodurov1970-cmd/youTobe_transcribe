services:
  # ==========================================
  # n8n закомментирован, так как для транскрибации он не нужен
  # ==========================================
  # n8n:
  #   image: n8nio/n8n
  #   container_name: n8n
  #   restart: unless-stopped
  #   ports:
  #     - "5678:5678"
  #   environment:
  #     - DATABASE_URL=postgres://peter:peter@postgres:5432/youtube_tracker?sslmode=disable
  #     - N8N_HOST=localhost
  #     - N8N_PORT=5678
  #     - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
  #     - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
  #     - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
  #     - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin}
  #     - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
  #     - VUE_APP_URL_BASE_API=/
  #     - TZ=Europe/Minsk
  #   volumes:
  #     - n8n_n8n_data:/home/node/.n8n
  #   networks:
  #     - default
  #     - n8n_default
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=peter
      - POSTGRES_PASSWORD=peter
      - POSTGRES_DB=youtube_tracker
      - TZ=Europe/Minsk
    ports:
      - "5432:5432"
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peter -d youtube_tracker"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - default
      - n8n_default

  # ==========================================
  # Ollama закомментирована, чтобы не забирать VRAM у Whisper
  # ==========================================
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11435:11434"
  #   environment:
  #     - TZ=Europe/Minsk
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434 || exit 1'"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 60s
  #   networks:
  #     - default

  # ==========================================
  # main закомментирован (не нужен для транскрибации)
  # ==========================================
  # main:
  #   build: .
  #   container_name: main
  #   restart: unless-stopped
  #   working_dir: /app/n8n
  #   command: ["/app/n8n/main"]
  #   env_file:
  #     - .env
  #   environment:
  #     - DATABASE_URL=postgres://peter:peter@postgres:5432/youtube_tracker?sslmode=disable
  #     - OBSIDIAN_PATH=/obsidian
  #     - YT_DLP_PATH=/usr/local/bin/yt-dlp
  #     - COOKIES_FILE=/cookies/cookies.txt
  #     - OLLAMA_URL=http://ollama:11434
  #     - TZ=Europe/Minsk
  #   volumes:
  #     - ./internal/cookies/cookies.txt:/cookies/cookies.txt
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  transcribe:
    build: .
    container_name: transcribe
    restart: unless-stopped
    working_dir: /app/n8n
    command: ["/app/n8n/transcribe"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://peter:peter@postgres:5432/youtube_tracker?sslmode=disable
      - YT_DLP_PATH=/usr/local/bin/yt-dlp
      - COOKIES_FILE=/cookies/cookies.txt
      - TZ=Europe/Minsk
      - TRANSCRIBE_SESSION_HOURS=0
      - WHISPER_MODEL=medium
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE=float16
    volumes:
      - ./internal/cookies/cookies.txt:/cookies/cookies.txt
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ==========================================
  # webui, classifier, publisher закомментированы
  # ==========================================
  # webui:
  #   build: .
  #   ...
  # classifier:
  #   build: .
  #   ...
  # publisher:
  #   build: .
  #   ...

volumes:
  n8n_postgres_data:
  n8n_n8n_data:
  # ollama_data:

networks:
  n8n_default:
    driver: bridge